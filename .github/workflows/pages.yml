name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble website files
        run: |
          mkdir -p _site
          mkdir -p _site/VELVETROOMEMILIANOZAPATA
          cp index.html dashboard.html agregarusuario.html styles.css config.js login.js dashboard.js agregarusuario.js edicionusuarios.js utils.js _site/
          cp -R IMAGENESINTERIORESDELHOTEL web _site/
          cp VELVETROOMEMILIANOZAPATA/logo.jpeg VELVETROOMEMILIANOZAPATA/logoconelnombredelhotel.jpeg VELVETROOMEMILIANOZAPATA/fotodeportadahotelentradabienvenida.jpeg VELVETROOMEMILIANOZAPATA/imagendehabitacionespordefecto.jpg _site/VELVETROOMEMILIANOZAPATA/
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _deploy
      - name: Publish site files
        run: |
          rsync -a --delete --exclude=.git _site/ _deploy/
          git -C _deploy config user.name "github-actions[bot]"
          git -C _deploy config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _deploy add -A
          if git -C _deploy diff --cached --quiet; then
            :
          else
            git -C _deploy commit -m "Deploy ${GITHUB_SHA} to GitHub Pages"
            git -C _deploy push origin gh-pages
          fi
